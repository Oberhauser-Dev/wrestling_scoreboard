name: wrestling_scoreboard
repository: https://github.com/Oberhauser-dev/wrestling_scoreboard
publish_to: none
environment:
  sdk: ^3.12.0
workspace:
  - wrestling_scoreboard_client
  - wrestling_scoreboard_server
  - wrestling_scoreboard_common
  - wrestling_scoreboard_generator

dev_dependencies:
  melos: ^7.7.0

melos:
  command:
    version:
      # Only allow versioning to happen on main branch.
      branch: main
      # Generates a link to a prefilled GitHub release creation page.
      releaseUrl: true
      includeCommitId: true
      linkToCommits: true

    bootstrap:
      environment:
        sdk: ^3.12.0

  scripts:
    upgrade: melos exec flutter pub upgrade

    test:select:
      # Set max concurrency to 1, as server tests share the same database.
      run: melos exec -c 1 -- flutter test --concurrency=1
      packageFilters:
        dirExists: test
      description: Run `flutter test` for selected packages.

    test:
      run: melos run test:select --no-select
      description: Run all Flutter tests in this project.
