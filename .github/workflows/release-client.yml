name: release client

on:
  push:
    tags:
      - 'wrestling_scoreboard_client-v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel: `stable` releases the tag and publishes to the stores, `nightly` replaces the nightly prerelease and is connected to the dev server.'
        required: false
        default: 'stable'
        type: choice
        options:
          - 'stable'
          - 'nightly'
      dry_run:
        description: 'Only build, without releasing or publishing'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      channel:
        required: false
        default: 'stable'
        type: string
      dry_run:
        required: false
        default: false
        type: boolean

env:
  # The inputs are empty on tag pushes, which are stable releases.
  IS_NIGHTLY: ${{ inputs.channel == 'nightly' }}
  NIGHTLY_TAG: 'wrestling_scoreboard_client-nightly'

jobs:
  pre-run:
    name: Calculate release version
    runs-on: ubuntu-latest
    steps:
      - name: Recreate nightly prerelease
        # The builds upload their assets to the existing release of the tag.
        if: env.IS_NIGHTLY == 'true' && !inputs.dry_run
        run: |
          gh release delete "$NIGHTLY_TAG" --cleanup-tag --yes || true
          gh release create "$NIGHTLY_TAG" \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "Client nightly (${GITHUB_SHA::7})" \
            --notes "Rolling build of \`main\` at $GITHUB_SHA, connected to the dev server. Not intended for production use."
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - id: release-version
        run: |
          if [ "$IS_NIGHTLY" = "true" ]; then
            # Use the version of the pubspec.yaml
            echo "version=" >> $GITHUB_OUTPUT
            echo "build-metadata=nightly.${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          else
            TAG="${{ github.ref_name }}"
            RELEASE_VERSION="${TAG#*wrestling_scoreboard_client-}"
            echo "version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
            echo "build-metadata=" >> $GITHUB_OUTPUT
          fi
      - id: include-jobs
        # See: https://github.com/actions/runner/issues/1985#issuecomment-1573518052
        run: |
          content='
            {"platform": "android", "os": "ubuntu-latest", "build-type": "apk"},
            {"platform": "windows", "os": "windows-latest", "build-type": "windows"},
            {"platform": "windows", "os": "windows-11-arm", "build-type": "windows"},
            {"platform": "windows", "os": "windows-latest", "build-type": "msix"},
            {"platform": "windows", "os": "windows-11-arm", "build-type": "msix"},
            ${{ env.IS_NIGHTLY != 'true' && '{"platform": "windows", "os": "windows-latest", "build-type": "msix-store"},' || '' }}
            ${{ env.IS_NIGHTLY != 'true' && '{"platform": "windows", "os": "windows-11-arm", "build-type": "msix-store"},' || '' }}
            {"platform": "linux", "os": "ubuntu-latest", "build-type": "debian"},
            {"platform": "linux", "os": "ubuntu-24.04-arm", "build-type": "debian"},
            {"platform": "web", "os": "ubuntu-latest", "build-type": "web"},
            {"platform": "macos", "os": "macos-14", "build-type": "macos"},
            ${{ inputs.dry_run && '{"platform": "ios", "os": "macos-14", "build-type": "ipa"},' || '' }}
          '
          # Remove last ',' with ::-1 ❤️
          echo "jobs=[${content::-1}]" | tr -d '[:space:]' >> $GITHUB_OUTPUT
    outputs:
      release-version: ${{ steps.release-version.outputs.version }}
      build-metadata: ${{ steps.release-version.outputs.build-metadata }}
      jobs: ${{ steps.include-jobs.outputs.jobs }}

  release-client:
    name: Release Client as ${{ matrix.build-type }} (${{ matrix.platform }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: pre-run
    timeout-minutes: 30
    defaults:
      run:
        working-directory: wrestling_scoreboard_client

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pre-run.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          # Remove checks when arm is supported on stable: https://github.com/flutter/flutter/issues/164431
          flutter-version: '3.47.4'
          channel: ${{ endsWith(matrix.os, '-arm') && 'master' || 'stable' }}
      # doctor is needed to download the arm master artifacts:
      - run: flutter doctor
      - run: flutter --version
      - uses: bluefireteam/melos-action@v3
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          # AGP8 needs JDK 17
          distribution: 'temurin'
          java-version: '17'
      - name: Install Linux Dependencies
        # Install libunwind-dev, see https://github.com/actions/runner-images/issues/6399#issuecomment-1285011525
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Build
        uses: oberhauser-dev/flutter-release-action@v0
        with:
          working-directory: wrestling_scoreboard_client
          dry-run: ${{ inputs.dry_run == true }}
          app-name: 'wrestling_scoreboard_client'
          app-version: ${{ needs.pre-run.outputs.release-version }}
          build-metadata: ${{ needs.pre-run.outputs.build-metadata }}
          tag: ${{ env.IS_NIGHTLY != 'true' && github.ref || env.NIGHTLY_TAG }}
          build-type: ${{ matrix.build-type }}
          token: ${{ github.token }}
          # Android is not configured to create `--release` builds without signing, e.g. in pull requests.
          # Nightly builds are debug builds, so they are not signed with the production key and cannot replace the store app.
          build-args: |-
            ${{ matrix.platform == 'web' && '--wasm' || '' }}
            ${{ matrix.platform == 'android' && (env.IS_NIGHTLY == 'true' || secrets.ANDROID_KEYSTORE == '') && '--debug' || '' }}
            ${{ env.IS_NIGHTLY == 'true' && matrix.platform == 'web' && '--base-href=/wrestling_scoreboard/' || '' }}
            ${{ env.IS_NIGHTLY != 'true' && '--dart-define=APP_ENVIRONMENT=production' || '' }}
            ${{ env.IS_NIGHTLY != 'true' && '--dart-define=API_URL=https://server.wrestling-scoreboard.oberhauser.dev/api' || '--dart-define=API_URL=https://dev.server.wrestling-scoreboard.oberhauser.dev/api' }}
            ${{ env.IS_NIGHTLY != 'true' && '--dart-define=WEB_SOCKET_URL=wss://server.wrestling-scoreboard.oberhauser.dev/ws' || '--dart-define=WEB_SOCKET_URL=wss://dev.server.wrestling-scoreboard.oberhauser.dev/ws' }}
            ${{ env.IS_NIGHTLY != 'true' && '--dart-define=WEB_CLIENT_URL=https://wrestling-scoreboard.oberhauser.dev' || '--dart-define=WEB_CLIENT_URL=https://oberhauser-dev.github.io/wrestling_scoreboard/#' }}
            ${{ env.IS_NIGHTLY != 'true' && '--dart-define=USE_PATH_URL_STRATEGY=true' || '' }}
          android-keystore-file-base64: ${{ secrets.ANDROID_KEYSTORE }}
          android-keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          android-key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          android-key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Identity of the Microsoft Store (Partner Center > Product identity), the publisher only applies to the store build.
          windows-msix-identity-name: ${{ secrets.WINDOWS_STORE_IDENTITY_NAME }}
          windows-msix-publisher-display-name: ${{ secrets.WINDOWS_STORE_PUBLISHER_DISPLAY_NAME }}
          windows-msix-publisher: ${{ matrix.build-type == 'msix-store' && secrets.WINDOWS_STORE_PUBLISHER || '' }}
      - name: Upload pages artifact
        if: env.IS_NIGHTLY == 'true' && !inputs.dry_run && matrix.platform == 'web'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./wrestling_scoreboard_client/build/web

  publish-client:
    needs: [ release-client, pre-run ]
    if: inputs.channel != 'nightly' && !inputs.dry_run
    name: Publish Client on ${{ matrix.publish-distributor }} (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: wrestling_scoreboard_client

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
            publish-distributor: android-google-play
          - os: ubuntu-latest
            platform: web
            publish-distributor: web-server
          - os: macos-14
            platform: ios
            publish-distributor: ios-app-store
          - os: windows-latest
            platform: windows
            publish-distributor: windows-ms-store

    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          # AGP8 needs JDK 17
          distribution: 'temurin'
          java-version: '17'
      - uses: bluefireteam/melos-action@v3
      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Publish
        uses: oberhauser-dev/flutter-release-action@v0
        with:
          working-directory: wrestling_scoreboard_client
          dry-run: false
          app-name: 'wrestling_scoreboard_client'
          app-version: ${{ needs.pre-run.outputs.release-version }}
          tag: ${{ github.ref }}
          token: ${{ github.token }}
          build-args: |-
            ${{ matrix.platform == 'web' && '--wasm' || '' }}
            --dart-define=APP_ENVIRONMENT=production
            --dart-define=API_URL=https://server.wrestling-scoreboard.oberhauser.dev/api
            --dart-define=WEB_SOCKET_URL=wss://server.wrestling-scoreboard.oberhauser.dev/ws
            --dart-define=WEB_CLIENT_URL=https://wrestling-scoreboard.oberhauser.dev
            --dart-define=USE_PATH_URL_STRATEGY=true
          publish-stage: internal
          publish-distributor: ${{ matrix.publish-distributor }}
          # Android
          publish-android-release-status: 'completed' # Release status "completed" only works, if the app was released to the public (open testing or production).
          publish-android-fastlane-secrets-json-base64: ${{ secrets.ANDROID_GOOGLE_PLAY_JSON }}
          android-keystore-file-base64: ${{ secrets.ANDROID_KEYSTORE }}
          android-keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          android-key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          android-key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # iOS
          ios-apple-username: ${{ secrets.IOS_APPLE_USERNAME }}
          ios-api-key-id: ${{ secrets.IOS_API_KEY_ID }}
          ios-api-issuer-id: ${{ secrets.IOS_API_ISSUER_ID }}
          ios-api-private-key-base64: ${{ secrets.IOS_API_PRIVATE_KEY }}
          ios-content-provider-id: ${{ secrets.IOS_CONTENT_PROVIDER_ID }}
          ios-team-id: ${{ secrets.IOS_TEAM_ID }}
          ios-distribution-private-key-base64: ${{ secrets.IOS_DISTRIBUTION_PRIVATE_KEY }}
          ios-distribution-cert-base64: ${{ secrets.IOS_DISTRIBUTION_CERT }}
          # Windows
          publish-windows-tenant-id: ${{ secrets.WINDOWS_STORE_TENANT_ID }}
          publish-windows-client-id: ${{ secrets.WINDOWS_STORE_CLIENT_ID }}
          publish-windows-client-secret: ${{ secrets.WINDOWS_STORE_CLIENT_SECRET }}
          publish-windows-seller-id: ${{ secrets.WINDOWS_STORE_SELLER_ID }}
          publish-windows-product-id: ${{ secrets.WINDOWS_STORE_PRODUCT_ID }}
          # The packages (publish-windows-packages) are taken from the msix-store builds of the release-client job.
          # Optional, publishes to the public (after certification) otherwise
          publish-windows-flight-id: ${{ secrets.WINDOWS_STORE_FLIGHT_ID }}
          # Web
          publish-web-host: ${{ secrets.WEB_HOST }}
          publish-web-path: ${{ secrets.WEB_PATH }}
          publish-web-ssh-port: ${{ secrets.WEB_SSH_PORT }}
          publish-web-ssh-user: ${{ secrets.WEB_SSH_USER }}
          publish-web-ssh-private-key-base64: ${{ secrets.WEB_SSH_PRIVATE_KEY }}
