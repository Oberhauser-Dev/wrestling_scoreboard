name: Prepare release
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Version as prerelease'
        required: false
        default: false
        type: boolean

jobs:
  prepare-release:
    name: Prepare release
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
      - uses: bluefireteam/melos-action@v3
        with:
          run-versioning: ${{ inputs.prerelease == false }}
          run-versioning-prerelease: ${{ inputs.prerelease == true }}
          include-private: true
          create-pr: true

      - name: Add database migration for the release to the PR
        if: ${{ inputs.prerelease == false }}
        env:
          BRANCH: release-${{ github.run_id }}
        run: |
          # melos-action pushes the PR to the branch `release-<run id>`.
          if ! git fetch origin "$BRANCH"; then
            echo "No release branch $BRANCH was pushed, skipping."
            exit 0
          fi
          git checkout -B "$BRANCH" FETCH_HEAD
          VERSION=$(sed -n 's/^version:[[:space:]]*//p' wrestling_scoreboard_server/pubspec.yaml)
          VERSION="${VERSION%%+*}"
          DIR=wrestling_scoreboard_server/database/migration
          FILE="$DIR/v${VERSION}_Release.sql"
          if [ -f "$FILE" ]; then
            echo "$FILE already exists, skipping."
            exit 0
          fi
          printf "UPDATE public.migration\nSET min_client_version = '%s';\n" "$VERSION" > "$FILE"
          git add "$FILE"
          git commit -m "chore(release): Add database migration for v$VERSION"
          git push origin "$BRANCH"
