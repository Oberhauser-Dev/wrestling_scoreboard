name: Prepare release
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Version as prerelease'
        required: false
        default: false
        type: boolean

jobs:
  prepare-release:
    name: Prepare release
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
      - uses: bluefireteam/melos-action@v3
        with:
          run-versioning: ${{ inputs.prerelease == false }}
          run-versioning-prerelease: ${{ inputs.prerelease == true }}
          include-private: true
          create-pr: true

      - name: Add database migration for the release to the PR
        if: ${{ inputs.prerelease == false }}
        env:
          BRANCH: release-${{ github.run_id }}
        run: |
          # melos-action pushes the PR to the branch `release-<run id>`.
          if ! git fetch origin "$BRANCH"; then
            echo "No release branch $BRANCH was pushed, skipping."
            exit 0
          fi
          git checkout -B "$BRANCH" FETCH_HEAD
          VERSION=$(sed -n 's/^version:[[:space:]]*//p' wrestling_scoreboard_server/pubspec.yaml)
          VERSION="${VERSION%%+*}"
          DB_DIR=wrestling_scoreboard_server/database
          # A migration of the release version itself (e.g. `v1.2.3_*.sql`) already sets the database to this version.
          if compgen -G "$DB_DIR/migration/v${VERSION}_*.sql" > /dev/null; then
            echo "A migration for v$VERSION already exists, skipping."
            exit 0
          fi
          # Breaking change: the major version changed, or the minor version for 0.x versions (like Dart's caret syntax).
          PREV_VERSION=$(git tag -l 'wrestling_scoreboard_server-v*' --sort=-v:refname \
            | sed -n 's/^wrestling_scoreboard_server-v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' | head -n 1)
          IFS=. read -r MAJOR MINOR _ <<< "$VERSION"
          IFS=. read -r PREV_MAJOR PREV_MINOR _ <<< "$PREV_VERSION"
          if [ -z "$PREV_VERSION" ] || [ "$MAJOR" != "$PREV_MAJOR" ] || { [ "$MAJOR" = 0 ] && [ "$MINOR" != "$PREV_MINOR" ]; }; then
            BREAKING=true
          else
            BREAKING=false
          fi
          echo "Previous release: v$PREV_VERSION, breaking change: $BREAKING"
          FILE="$DB_DIR/migration/v${VERSION}_Release.sql"
          MIGRATION_ROW='/^COPY public\.migration (semver, min_client_version) FROM stdin;$/'
          if [ "$BREAKING" = true ]; then
            printf "UPDATE public.migration\nSET min_client_version = '%s';\n" "$VERSION" > "$FILE"
            # Set semver and min_client_version of the default dumps to the release version.
            DUMP_UPDATE="$MIGRATION_ROW"'{n;s/.*/'"$VERSION\t$VERSION"'/}'
          else
            printf -- "-- Release without breaking changes, min_client_version stays unchanged.\n" > "$FILE"
            # Set only semver of the default dumps to the release version.
            DUMP_UPDATE="$MIGRATION_ROW"'{n;s/^[^[:space:]]*/'"$VERSION"'/}'
          fi
          for DUMP in "$DB_DIR"/dump/*.sql; do
            sed -i "$DUMP_UPDATE" "$DUMP"
          done
          git add "$FILE" "$DB_DIR/dump"
          git commit -m "chore(release): Update database to v$VERSION"
          git push origin "$BRANCH"
