name: test
on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter Version'
        required: false
        default: 'any'
        type: choice
        options:
          - 'any'
          - '3.44.x'
      flutter_channel:
        description: 'Flutter Channel'
        required: false
        default: 'stable'
        type: choice
        options:
          - 'stable'
          - 'beta'
          - 'dev'
          - 'master'
      fatal_warnings:
        description: 'Treat warnings as fatal'
        required: false
        default: true
        type: boolean

  workflow_call:
    inputs:
      flutter_version:
        required: false
        default: '3.44.9'
        type: string
      flutter_channel:
        required: false
        default: 'stable'
        type: string
      fatal_warnings:
        required: false
        default: true
        type: boolean

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: ${{ inputs.flutter_channel }}
      - uses: bluefireteam/melos-action@v3
      - run: melos format --set-exit-if-changed
      # Move to `melos analyze` when upgrading to melos 8.2.0
      - run: flutter analyze ${{ inputs.fatal_warnings && '--fatal-infos --fatal-warnings' || '--no-fatal-warnings --no-fatal-infos' }}
      - name: Prepare server
        working-directory: wrestling_scoreboard_server
        run: |
          cp .env.example .env
          source .env
          sudo systemctl start postgresql.service
          sudo -u postgres psql postgres -c "CREATE USER ${DATABASE_USER} WITH PASSWORD '${DATABASE_PASSWORD}';"
          sudo -u postgres psql postgres -c "CREATE DATABASE ${DATABASE_NAME} WITH OWNER = ${DATABASE_USER};"
          sudo -u postgres psql ${DATABASE_NAME} -c "ALTER SCHEMA public OWNER TO ${DATABASE_USER};"
          sudo -u postgres psql ${DATABASE_NAME} -c "SET TIMEZONE TO 'UTC';"
      - run: melos run test
