name: pull-request
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  call-test:
    uses: ./.github/workflows/test.yml
  call-build-server:
    needs:
      - call-test
    uses: ./.github/workflows/release-server.yml
    with:
      channel: nightly
      dry_run: true
  call-build-client:
    needs:
      - call-test
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/release-client.yml
    with:
      channel: nightly
      dry_run: true
